lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 10000
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 10000
        max_images: 1
        increase_log_steps: False  

  trainer:
    benchmark: True
    max_steps: 1000000
    accumulate_grad_batches: 2
    gpus: '0'